version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/msme_invest
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      - CLIENT_ORIGIN=http://localhost:5173
      - DEMO_AUTO_VERIFY=${DEMO_AUTO_VERIFY:-false}
    depends_on:
      - mongo
    networks:
      - mern-network

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - mern-network

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
