version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/msme_invest
      - JWT_SECRET=supersecretkey
    depends_on:
      - mongo
    networks:
      - mern-network

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - mern-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
