name: Daily Market Data Update

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Run Linter and Fix
      run: |
        node server/scripts/runLinter.js

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'Manas Dutt'
        git config --global user.email 'manasdutt2003@gmail.com'
        git add server/data/daily-lint-report.json
        git commit -m "style: auto-fix linting issues [skip ci]" || echo "No changes to commit"
        git push
